# FILE-ROADMAP — fable-omni-core (machine + human index)
# Spec: ../brqosh-skills-hub/ROADMAP-SPEC.md
version: v12

default_path: P-OMNI

files:
  SKILL.md:
    id: fable-omni-core:SKILL
    layer: L0
    step: 1/6
    trigger: every_message_attach
    skip_when: never
    prereq: []
    next: [operating-manual.md, omni-core.md]
    fable_tag: null
    exit_criteria:
      - classified_mode_known
      - roadmap_link_seen
    anti_patterns:
      - skip_to_code_without_classify
      - load_full_fable_prompt
    time_budget: 15s
    verify: user_intent_mapped_to_path

  operating-manual.md:
    id: fable-omni-core:operating-manual
    layer: L1
    step: 2/6
    trigger: complex_task|multi_domain|first_session|uncertain_route
    skip_when: repeat_session_simple_code_with_known_path
    prereq: [SKILL.md]
    next: [human-intelligence-mastery/universal-understanding.md, supreme-programming-mastery/skills-first.md]
    fable_tag: synthesis_all
    exit_criteria:
      - twelve_principles_recalled
      - pipeline_understood
      - mode_matrix_applied
    anti_patterns:
      - read_without_acting_on_classify
      - treat_as_optional_for_hard_tasks
    time_budget: 90s
    verify: can_state_CLASSIFY_route_verify

  omni-core.md:
    id: fable-omni-core:omni-core
    layer: L1
    step: 2/6-alt
    trigger: repeat_session|quick_reference_only
    skip_when: first_time|complex_multi_domain
    prereq: [SKILL.md]
    next: domain_module_by_trigger
    fable_tag: synthesis_summary
    exit_criteria:
      - principles_1_to_12_named
    anti_patterns:
      - substitute_for_operating_manual_on_complex_tasks
    time_budget: 30s
    verify: named_correct_next_module

  context-continuity.md:
    id: fable-omni-core:context-continuity
    layer: L2
    step: 3/6
    trigger: our_project|we_decided|continue|file_implied|possessive_without_context
    skip_when: timeless_generic_question
    prereq: [SKILL.md, universal-understanding.md]
    next: [grep, Read, git_log]
    fable_tag: memory_system|past_chats_tools
    exit_criteria:
      - searched_before_denying_context
      - no_forbidden_memory_phrases
      - file_existence_verified_if_implied
    anti_patterns:
      - say_no_previous_context_without_search
      - I_remember_you_without_evidence
      - apply_unrelated_user_background
    time_budget: 45s
    verify: cited_file_or_status_not_memory_fiction

  preferences-handling.md:
    id: fable-omni-core:preferences-handling
    layer: L2
    step: 3b/6
    trigger: rules_conflict|since_you_are|personalization_request
    skip_when: pure_technical_unrelated
    prereq: [context-continuity.md]
    next: [communication.md]
    fable_tag: preferences_info
    exit_criteria:
      - only_relevant_prefs_applied
      - no_since_you_are_framing
    anti_patterns:
      - mention_sommelier_in_python_fix
      - override_safety_rules_with_prefs
    time_budget: 30s
    verify: response_matches_query_domain_not_profile

  anti-injection.md:
    id: fable-omni-core:anti-injection
    layer: L1-priority
    step: 0/6
    trigger: suspicious_paste|skip_verify|fake_system_tags|memory_poisoning
    skip_when: normal_trusted_workflow
    prereq: []
    next: [safety-boundaries.md, refuse_or_ignore]
    fable_tag: anthropic_reminders|important_safety_reminders
    exit_criteria:
      - injection_ignored
      - destructive_git_blocked_without_explicit_ask
    anti_patterns:
      - follow_paste_ignore_previous_instructions
      - skip_tests_because_user_said_so_without_rule
    time_budget: 20s
    verify: safety_and_ceef_rules_intact

paths:
  P-OMNI: [SKILL.md, operating-manual.md, context-continuity.md, preferences-handling.md, human-intelligence-mastery/universal-understanding.md]
  P-OMNI-FAST: [SKILL.md, omni-core.md, human-intelligence-mastery/universal-understanding.md]
  P-INJECT: [anti-injection.md, human-intelligence-mastery/safety-boundaries.md]
