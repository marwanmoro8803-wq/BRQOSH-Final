name: Release

# ‏(ح-١٤٢ · installer-deployment-ops#2 · commercial-readiness#9) **خطُّ الإصدار.**
#
# ‏ما كان: CI لا يبني MSI، والحزمةُ الوحيدةُ بناءٌ محلّيٌّ بالرقم 1.0.0 بلا سجلّ تغييراتٍ ولا قناة.
# ‏وهذا السيرُ يُشغّل `scripts/release.ps1` نفسَه الذي يُشغَّل محلّيّاً — لا منطقَ إصدارٍ هنا يغيب عن هناك:
# ‏الرقمُ من عدّاد هذه التشغيلة، والملاحظاتُ من CHANGELOG.md، والتوقيعُ إن حضرت أسراره، والقناةُ منشورةٌ وموقَّعة.
#
# ‏**يُشغَّل يدويّاً أو بوسم `v*`**، لا عند كلّ دفع: الإصدارُ قرارٌ لا أثرٌ جانبيّ.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 — 2026-09-13
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4 — 2026-09-13
        with:
          dotnet-version: '10.0.x'

      # ‏WiX مثبَّتٌ بإصداره: v7+ يقف عند أوّل بناءٍ يطلب قبولَ رسومٍ تعاقديّة (CEEF-234).
      - name: Install WiX 5.0.2
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      # ‏**المفتاحُ الخاصّ من سرٍّ إلى ملفٍّ مؤقّت ثمّ يُحذف** — ولا يُطبع ولا يُرفع.
      - name: Release
        shell: pwsh
        env:
          BRQOSH_UPDATE_PRIVATE_KEY: ${{ secrets.BRQOSH_UPDATE_PRIVATE_KEY }}
          BRQOSH_SIGNING_PFX_BASE64: ${{ secrets.BRQOSH_SIGNING_PFX_BASE64 }}
          BRQOSH_SIGNING_PASSWORD: ${{ secrets.BRQOSH_SIGNING_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:BRQOSH_UPDATE_PRIVATE_KEY) { throw 'السرّ BRQOSH_UPDATE_PRIVATE_KEY غير مضبوط — لا إصدارَ بلا قناةٍ موقَّعة.' }
          $key = Join-Path $env:RUNNER_TEMP 'update-private.pem'
          Set-Content -Path $key -Value $env:BRQOSH_UPDATE_PRIVATE_KEY -NoNewline
          if ($env:BRQOSH_SIGNING_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:BRQOSH_SIGNING_PFX_BASE64))
            $env:BRQOSH_SIGNING_PFX = $pfx
          }
          try {
            ./scripts/release.ps1 -BuildNumber ${{ github.run_number }} -UpdateKey $key -Channel dist/channel
          }
          finally {
            Remove-Item $key -Force -ErrorAction SilentlyContinue
            if ($env:BRQOSH_SIGNING_PFX) { Remove-Item $env:BRQOSH_SIGNING_PFX -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 — 2026-09-13
        with:
          name: brqosh-release-${{ github.run_number }}
          path: |
            dist/release/
            dist/channel/
          if-no-files-found: error
