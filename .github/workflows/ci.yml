name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# ‏(م-٤ · ن-١٣) **صلاحيّاتُ الرمز — والافتراضُ كان مفتوحاً.**
#
# ‏بلا هذا المقطع يأخذ `GITHUB_TOKEN` صلاحيّاتِ المستودع الافتراضيّة، وقد تكون
# ‏`contents: write` على إعداداتٍ قديمة. **وقيس أنّ سيرَ العمل لا يستعمل الرمزَ إطلاقاً**:
# ‏بحثٌ عن `GITHUB_TOKEN|secrets.|github.token|gh api|gh pr|git push` يُعيد صفراً
# ‏(‏وشاهدُ ضبطٍ موجب: `env:` يظهر خمسَ مرّات في الملفّ نفسِه). فالقراءةُ تكفي بالبرهان
# ‏لا بالتقدير. و`upload-artifact` يُصادِق بـ`ACTIONS_RUNTIME_TOKEN` لا بهذا الرمز.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest

    # (CEEF-237 · ج-٢) ‏**خادمُ PostgreSQL — وبدونه لا تحرس هذه البوّابةُ شيئاً.**
    #
    # ‏`[PostgresFact]` يتخطّى حين لا يجد خادماً. ولم تكن هنا خدمةٌ ولا `BRQOSH_REQUIRE_PG`،
    # ‏**فاثنان وعشرون اختباراً كانت تُتخطّى في كلّ تشغيلة** — وهي بالضبط ما يحرس صحّة الدفتر
    # ‏عند التزاحم: الفتراتُ المالية · إقفالُ السنة · تكلفةُ المخزون · التكاليفُ المُحمَّلة ·
    # ‏الجردُ · **ترقيمُ المستندات** · سلسلةُ التدقيق · الخزينةُ وقفلُها · قفلُ ICV ·
    # ‏تطابقُ المزوّدَين · النسخُ والاستعادة. أي أنّ الأخضرَ كان يعني «لم يُفحص» لا «فُحص فنجا».
    #
    # ‏و`windows-latest` لا يشغّل حاويات لينكس، فلا `services:` هنا: يُشغَّل الخادمُ
    # ‏المُثبَّت على الصورة صراحةً في خطوةٍ أولى.

    env:
      BRQOSH_PG_HOST: localhost
      BRQOSH_PG_PORT: "5432"
      # ‏لا كلمةَ مرورٍ مكتوبةً هنا: تُولَّد في الخطوة أدناه وتُصدَّر إلى GITHUB_ENV.
      # ‏(‏وبوّابةُ الأسرار نفسُها أمسكت النسخةَ الأولى المكتوبة — فهذا فعلُ الحارس لا التفافٌ عليه.)
      # ‏**غيابُ الخادم يصير فشلاً لا تخطّياً** — وهذا ما يجعل البوّابةَ بوّابة.
      BRQOSH_REQUIRE_PG: "1"

    steps:
      # ‏(م-٤ · ن-١٣) ‏**الإجراءاتُ مثبّتةٌ ببصمةٍ لا بوسمٍ متحرّك.**
      #
      # ‏الوسمُ `@v4` مؤشّرٌ يملكه صاحبُ الإجراء ويستطيع تحريكَه، **فمستودعٌ مخترَقٌ يُبدّل
      # ‏ما يجري عندنا دون أن يتغيّر حرفٌ في هذا الملفّ**. والبصمةُ لا تتحرّك.
      #
      # ‏**والتثبيتُ وحدَه انحدارٌ لولا `dependabot`:** قِيس أنّ `v4` **قناةُ ترقيعٍ حيّة** —
      # ‏قمّتُها عند التثبيت رسالتُها `backport fixes to releases-v4 (#2524)` بتاريخ
      # ‏2026-07-16، وتعالج فحصاً غيرَ آمنٍ لطلبات الدمج الخارجيّة. **فتثبيتٌ بلا مُحدِّثٍ
      # ‏يُبدّل انجرافاً صامتاً بتقادمٍ صامت** — ولذلك يُشحن `.github/dependabot.yml` في
      # ‏هذا التغيير نفسِه، وهو ما يجعل البصمةَ قناةً مضبوطةً لا تجميداً.
      #
      # ‏**وهذه الأسطرُ متأخّرةٌ ثلاثةَ إصداراتٍ رئيسة** (الأحدثُ v7.0.1 و v6.0.0)، ولم
      # ‏تُرفَع هنا عمداً: التثبيتُ مسألةُ أمن، والترقيةُ الكبرى مسألةُ سلوك، **وخلطُهما
      # ‏يُدخل خطرَ ترقيةٍ في تغييرٍ أمنيّ**. يرفعها `dependabot` بطلبٍ يُراجَع.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 — 2026-09-13
        with:
          # ‏(م-٤ · ن-١٣) ‏**الاعتمادُ لا يُترك في `.git/config`.**
          #
          # ‏`checkout` يكتب رمزَ العمل في إعدادات المستودع افتراضاً، **فأيُّ خطوةِ `run:`
          # ‏بعده تقرؤه** — وفيها خطواتٌ تُشغّل سكربتاتٍ وأدواتٍ من الشجرة. وقِيس أنّ
          # ‏سيرَ العمل لا يُجري عمليّةَ git واحدةً بعد الفحص، فالإسقاطُ بلا كلفة.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4 — 2026-09-13
        with:
          dotnet-version: '9.0.x'

      # (CEEF-237 · ج-٢) تشغيلُ PostgreSQL المُثبَّت على عدّاء ويندوز وضبطُ كلمة المرور.
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $svc = Get-Service -Name 'postgresql*' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $svc) { throw 'لا خدمةَ PostgreSQL على العدّاء — والبوّابةُ تشترطها.' }
          Start-Service $svc.Name
          $bin = (Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory |
                  Sort-Object Name -Descending | Select-Object -First 1).FullName + '\bin'
          # ‏كلمةُ postgres على صورة windows-latest هي 'root' — فإن تغيّرت، تسقط الخطوةُ
          # ‏برسالةٍ تُسمّي الافتراض بدل أن يُتخطّى الفحصُ صامتاً.
          $env:PGPASSWORD = 'root'
          $generated = [Convert]::ToBase64String([Guid]::NewGuid().ToByteArray()).TrimEnd('=')
          & "$bin\psql.exe" -U postgres -h localhost -p 5432 -c `
            "ALTER USER postgres PASSWORD '$generated';"
          if ($LASTEXITCODE -ne 0) { throw "تعذّر ضبطُ كلمة مرور postgres (exit=$LASTEXITCODE)." }
          "BRQOSH_PG_PASSWORD=$generated" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:PGPASSWORD = $generated
          $v = & "$bin\psql.exe" -U postgres -h localhost -p 5432 -tAc 'select version();'
          if ($LASTEXITCODE -ne 0) { throw 'الخادمُ لا يقبل الاتصالَ بعد الضبط.' }
          Write-Host "PostgreSQL جاهز: $v"

      - name: Restore
        run: dotnet restore Brqosh.sln

      # (م-١ · ن-٠١) ‏**عدّادُ التشغيلة هو ما يجعل كلَّ بناءٍ إصداراً مختلفاً.**
      #
      # ‏بدونه يبقى `BrqoshBuildNumber` صفراً فيشحن كلُّ بناءٍ بـ`1.0.0` — وهو العطلُ
      # ‏نفسُه الذي جعل الترقيةَ مستحيلة. والحقلُ الثالث هو ما يُرفع لأنّ Windows
      # ‏Installer يقارن ثلاثةَ حقولٍ ويُهمل الرابع.
      - name: Build Release
        run: dotnet build Brqosh.sln -c Release --no-restore -p:BrqoshBuildNumber=${{ github.run_number }}

      # (CEEF-236 · م-١٩) أدواتُ التشغيل خارج Brqosh.sln، فلم تكن تُبنى في أيّ بوّابة.
      # ومراجعةٌ عدائيّة أخرجت أنّ أربعاً منها انكسرت بتغييرٍ في Infrastructure ولم يشتكِ شيء —
      # ومنها FullScenarioAudit وهي خطوةٌ في كتيّب التنصيب. فتُبنى الآن، ويعضّ البناءُ وحدَه.
      # ‏(م-٥ · ن-٢٠) ‏**والنمطُ الشاملُ على `tools` هو سببُ أنّ الازدواجَ لم يُرَ.**
      #
      # ‏كانت نسختان من مجلس الشورى: `ShuraCouncil/` (محرّك v5 تُسمّيه كلُّ الوثائق) و
      # ‏`tools/ShuraCouncil/` (نسخةٌ أقدم). **وهذه الخطوةُ تبني ما تحت `tools` وحدَه**،
      # ‏فكانت تبني الظلَّ في كلّ تشغيلةٍ ولا تبني الأصلَ **أبداً** — بينما مُشغِّلُ الجذر
      # ‏كان يُفضّل الظلَّ أيضاً. فالازدواجُ لم يكن حشواً: **كان الشيءَ الوحيدَ الذي يُبقي
      # ‏محرّكاً في CI، وهو يحجب المحرّكَ الحقيقيّ**.
      #
      # ‏وبعد حذف الظلّ يصير الأصلُ خارجَ كلّ بناء: ليس تحت `tools/` وليس في `Brqosh.sln`.
      # ‏فيُسمّى صراحةً هنا، وبوّابةُ `OneShuraCouncilTests` تشترط بقاءَ هذا السطر.
      - name: Build ops tools
        shell: pwsh
        run: |
          $failed = @()
          $projects = @(Get-ChildItem tools -Filter *.csproj -Recurse | Select-Object -ExpandProperty FullName)
          $projects += (Resolve-Path "ShuraCouncil/ShuraCouncil.csproj").Path
          foreach ($project in $projects) {
              Write-Host "== $project"
              dotnet build $project -c Release --nologo
              if ($LASTEXITCODE -ne 0) { $failed += (Split-Path $project -Leaf) }
          }
          if ($failed.Count -gt 0) { throw "فشل بناء أدوات: $($failed -join ', ')" }

      - name: Security static scan
        shell: pwsh
        run: ./scripts/security-static-scan.ps1

      - name: UI UX Pro Max audit
        shell: pwsh
        run: ./scripts/ui-ux-pro-max-audit.ps1

      - name: Test Release + Coverage
        env:
          # (CEEF-229 · م2-٤) حُذف BRQOSH_SKIP_STRESS: بوّابتا الأداء تعملان الآن فعلاً
          # (نحو أربعٍ وأربعين ثانية). وكان المتغيّر مضبوطاً هنا **وفي**
          # tests/coverage.runsettings معاً، فإزالته من هنا وحدها لم تكن تكفي.
          BRQOSH_TEST: "1"
        # (م-٠ · ن-٠٦) ‏**`LogFileName` اسمٌ واحدٌ لأربعة مشاريع — فتدهس بعضَها.**
        #
        # ‏قِيس: ثلاثةُ تحذيرات `Overwriting results file` في تشغيلةٍ واحدة، ويبقى ملفٌّ
        # ‏واحدٌ هو آخرُ مشروعٍ أنهى. فبوّابةُ «صفرُ متخطًّى» أدناه كانت تفحص **1244
        # ‏اختباراً من 1774** — والثلاثةُ الباقية (‏Domain · Api · Desktop) خارجَ حكمها.
        # ‏ومُثبتٌ حيّاً: تخطٍّ مزروعٌ في `Domain.Tests` اختفى حين كتب `Api.Tests` فوقه.
        #
        # ‏و`LogFilePrefix` يُلحق باسم التجميعة والإطار، فيصير لكلّ مشروعٍ ملفُّه.
        run: >
          dotnet test Brqosh.sln -c Release --no-build --verbosity normal
          --logger "trx;LogFilePrefix=results"
          -p:XUnitParallelizeAssembly=false
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      # (CEEF-237 · ج-٢) ‏**صفرُ متخطًّى شرطٌ لا زينة.**
      # ‏لولا هذا لعاد التخطّي صامتاً بأيّ تغييرٍ في البيئة، وعاد الأخضرُ يعني «لم يُفحص».
      #
      # ‏(م-٠ · ن-٠٦) ‏وأُضيف حارسان بنيويّان — لأنّ عدَّ المتخطّى لا يعني شيئاً إن لم
      # ‏يُعلم **كم مشروعاً قيس أصلاً**:
      #   ١) عددُ ملفّات trx يجب أن يساوي عددَ مشاريع الاختبار. نقصانُه يعني دهساً أو
      #      مشروعاً لم يُشغَّل — وكلاهما يُبطل الحكم، والغيابُ الصامت أخطرُ من رقمٍ سيّئ.
      #   ٢) سمةُ `notExecuted` يجب أن تكون **حاضرة**. غيابُها يُقرأ صفراً في PowerShell
      #      فتمرّ trx مشوَّهةٌ بلا اعتراض — قِيس بملفٍّ اصطناعيٍّ بلا السمة فمرّ.
      - name: Assert nothing was skipped
        shell: pwsh
        run: |
          # ‏العددُ مشتقٌّ من الشجرة لا مكتوبٌ بيد: مشروعٌ جديدٌ يُحتسب من نفسِه.
          $projects = @(Get-ChildItem tests -Recurse -Filter *.Tests.csproj)
          $trx = @(Get-ChildItem TestResults -Recurse -Filter *.trx -ErrorAction SilentlyContinue)
          if ($trx.Count -eq 0) { throw 'لا ملفَّ نتائج (.trx) — لا يمكن إثباتُ عدم التخطّي.' }
          if ($trx.Count -ne $projects.Count) {
            throw ("‏عددُ ملفّات trx $($trx.Count) لا يساوي عددَ مشاريع الاختبار $($projects.Count). " +
                   "‏إمّا دُهست ملفّاتٌ (تحقّق من LogFilePrefix) أو لم يُشغَّل مشروع — " +
                   "‏وفي الحالتين الحكمُ أدناه يغطّي أقلَّ ممّا يدّعي.")
          }
          $skipped = 0
          foreach ($f in $trx) {
            $x = [xml](Get-Content $f.FullName)
            $counters = $x.TestRun.ResultSummary.Counters
            if ($null -eq $counters -or $null -eq $counters.notExecuted) {
              throw "‏$($f.Name): لا سمةَ notExecuted في Counters — trx مشوَّهةٌ لا تُقرأ صفراً."
            }
            $skipped += [int]$counters.notExecuted
          }
          if ($skipped -gt 0) { throw "‏$skipped اختباراً تُخطّى — والبوّابةُ تشترط صفراً." }
          Write-Host "‏صفرُ متخطًّى — على $($trx.Count) مشروعاً من $($projects.Count)."

      # (CEEF-229 · م2-٣) بوابة واحدة مُلزِمة، تدمج تقارير cobertura كلَّها اتّحاداً وتحكم
      # لكل تجميعة بعتبتها. حُذفت الخطوة «المعلوماتية» الثانية: كانت هي **الصادقة الوحيدة**
      # (حكمٌ لكل تجميعة) و`continue-on-error: true` يبتلع عضّتها — بينما البوابة المُلزِمة
      # تقرأ ملفاً واحداً تختاره بترتيب انتهاء العمليات. أي أن المُلزِم كان لا يقيس، والذي
      # يقيس كان غير مُلزِم. صارت واحدة تقيس وتُلزم.
      - name: Enforce coverage gate (merged, per-assembly floors)
        shell: pwsh
        run: ./scripts/check-coverage.ps1

      # (م-٠ · ن-٠٧) ‏**مخطّطُ الإنتاج من مصدرين، وحارسُهما لم يكن يُشغَّل في أيّ خطٍّ آليّ.**
      #
      # ‏المخطّطُ الذي تحصل عليه قاعدةُ إنتاجٍ نظيفة يأتي من: هجرات EF **ثمّ**
      # ‏`BrqoshSchemaUpdater` — ‏3,121 سطراً من DDL مكتوبٍ باليد يعمل بعد `MigrateAsync`.
      # ‏وDDL اليدُ يخطئ بصمت: عمودٌ نصّيٌّ حيث ينتظر النموذجُ `numeric(18,2)`، أو فهرسٌ
      # ‏فريدٌ نُسي فتتكرّر أرقامُ الفواتير ولا يشتكي أحد.
      #
      # ‏و`SchemaCoverageProbe` بُني ليمسك هذا بعينه — **وصفرُ استدعاءاتٍ له في `.github`
      # ‏أو `scripts`**، ولا `dotnet run` واحدٌ كان في هذا الملفّ. أقوى أصلٍ في المستودع
      # ‏غيرُ موصولٍ بشيء. وقد شُغِّل يدوياً فأعطى 6 PASS · 0 FAIL على قاعدةٍ **مأهولة**
      # ‏(444 صفّاً · 111/111 جدولاً) — فالوصلُ لا يُدخل عطلاً، بل يُثبّت ما يمرّ اليوم.
      #
      # ‏و`BRQOSH_REQUIRE_PG` أعلاه يجعل غيابَ الخادم **فشلاً لا تخطّياً** — وبدونه كان
      # ‏المسبارُ يطبع `[SKIP]` ويخرج بصفرٍ على أيّ عدّاء، فيصير بوّابةً خامسةً عمياء.
      - name: Schema coverage probe (two-source schema guard)
        shell: pwsh
        run: |
          dotnet run --project tools/SchemaCoverageProbe/SchemaCoverageProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "‏مسبارُ تغطية المخطّط سقط برمز $LASTEXITCODE." }

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 — 2026-09-13
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
