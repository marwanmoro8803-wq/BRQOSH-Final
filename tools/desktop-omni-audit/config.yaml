# BRQOSH Desktop Omni-Audit — configuration
# Aligns with tools/UiAudit + NavigationCatalog

repo_root: "../../"
desktop_project: "src/Brqosh.Desktop/Brqosh.Desktop.csproj"
desktop_source: "src/Brqosh.Desktop"
full_scenario_audit: "tools/FullScenarioAudit/FullScenarioAudit.csproj"

app:
  process_name: "Brqosh.Desktop"
  window_title_login: "تسجيل الدخول"
  window_title_main: "BRQOSH ERP"
  exe_candidates:
    - "src/Brqosh.Desktop/bin/Release/net10.0-windows/Brqosh.Desktop.exe"
    - "src/Brqosh.Desktop/bin/Debug/net10.0-windows/Brqosh.Desktop.exe"
  env:
    BRQOSH_UITEST: "1"
    BRQOSH_TEST: "1"

credentials:
  username_env: "BRQOSH_TEST_USERNAME"
  password_env: "BRQOSH_TEST_PASSWORD"
  default_username: "marwan"
  # (م-٥ · ن-٢٢) لا كلمة حرفية هنا — تُقرأ من BRQOSH_TEST_PASSWORD، ولا بديل احتياطي.
  default_password: ""

audit:
  profile: "Manufacturing"
  profiles_all: false
  seed_data: true
  navigate_all_pages: true
  payload_injection: true
  payloads_per_field: 10
  screenshot_every_step: true
  max_nav_pages: 0  # 0 = unlimited (all from NavigationCatalog)
  interaction_delay_ms: 800
  login_timeout_sec: 120
  page_timeout_sec: 45

automation:
  backend: "uia"  # pywinauto UIA — Windows WPF
  ocr_enabled: true
  ocr_lang: "ara+eng"

output:
  base_dir: "output"
  screenshots_dir: "output/screenshots"
  logs_dir: "output/logs"
  ui_map_file: "output/ui_map.json"
  audit_report: "output/AUDIT_REPORT.md"
  crisis_log: "output/logs/crisis.jsonl"

