# Sample — copy to repo root .github/workflows/ if desired
#
# ‏(م-٤ · ن-١٣) ‏**خاملٌ هنا، لكنّه قالبٌ يُنسَخ — فيُثبَّت مثلَ الحيّ.**
#
# ‏GitHub لا تقرأ إلّا `.github/workflows` في جذر المستودع، فهذا الملفّ لا يُشغَّل.
# ‏**لكنّ سطرَه الأوّل يدعو إلى نسخه** — وقالبٌ بأوسامٍ متحرّكة يُوَرِّث العطلَ إلى
# ‏كلّ من نسخه. فتُثبَّت بصماتُه ويُضبط مقطعُ الصلاحيّات كما في الحيّ.
name: Desktop QA Army
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  qa-army:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 — 2026-09-13
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4 — 2026-09-13
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 — 2026-09-13
        with:
          python-version: "3.12"
      - name: Build Desktop
        run: dotnet build src/Brqosh.Desktop/Brqosh.Desktop.csproj -c Release --nologo
      - name: QA Army (Retail smoke)
        shell: pwsh
        run: |
          cd tools/desktop-qa-army
          python -m venv .venv
          .\.venv\Scripts\pip install -r requirements.txt
          .\.venv\Scripts\python audit_orchestrator.py --profile Retail --headless
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 — 2026-09-13
        with:
          name: qa-army-reports
          path: tools/desktop-qa-army/audit_reports/
